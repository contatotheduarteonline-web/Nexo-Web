<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXO</title>
    <meta name="description" content="Planeje seus estudos, organize seu conteúdo e acompanhe sua evolução em um só lugar. Plataforma completa para concursos públicos, vestibulares, OAB, certificações e rotinas acadêmicas." />
    <meta property="og:title" content="NEXO" />
    <meta property="og:description" content="Planeje seus estudos, organize seu conteúdo e acompanhe sua evolução em um só lugar. Plataforma completa para concursos públicos, vestibulares, OAB, certificações e rotinas acadêmicas." />
    <link rel="icon" type="image/png" href="/nexo-notification-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        letter-spacing: -0.011em;
      }
      h1, h2, h3, h4, h5, h6, .font-display {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: -0.015em;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
    <script>
      // Tratamento gracioso de eventos de WebSocket/HMR para prevenir rejeições não tratadas no navegador
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('websocket') ||
          msg.includes('fechado sem ter sido aberto') ||
          msg.includes('closed without being opened') ||
          msg.includes('closed without opened')
        ) {
          event.preventDefault();
          console.debug('[NEXO/Vite] Evento WebSocket HMR tratado sem impacto na aplicação:', msg);
        }
      });
    </script>
  </head>
  <body class="bg-[#0F172A] text-[#F1F5F9] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
